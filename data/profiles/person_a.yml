# Person A profile — starter template.
# Same schema as person_b.yml. Fill in your own data; delete/replace the
# comments as you go.
#
# The app (app/src/lib/profile.ts) reads: name, age_years, height_cm, weight_kg,
# body_fat_pct, estimated_bmr_kcal, goals, nutrition_targets, medical_flags,
# food_preferences. Fill those in first — they're what unlocks the meal plan
# and the AI Meal Plan Designer for this profile.

name: FILL_IN
sex: FILL_IN               # male | female | other
date_of_birth: FILL_IN      # YYYY-MM-DD
age_years: FILL_IN
height_cm: FILL_IN
weight_kg: FILL_IN
body_fat_pct:                # optional; leave blank if unknown
estimated_bmr_kcal: FILL_IN  # from InBody/RelaxFit if available, else Mifflin-St Jeor estimate

# ── Activity ──────────────────────────────────────────────────────────────────
activity:
  - type: FILL_IN             # ex: musculacao, corrida, skate, natacao, yoga
    days_per_week: FILL_IN
    minutes_per_session: FILL_IN
    typical_time: FILL_IN      # morning | afternoon | evening
    intensity: FILL_IN         # light | moderate | hard
  # add more activities by copying the block above

# ── Sleep ─────────────────────────────────────────────────────────────────────
sleep:
  bedtime: FILL_IN            # "HH:MM"
  waketime: FILL_IN           # "HH:MM"

# ── Substances (leave empty/never if not applicable) ───────────────────────────
substances:
  caffeine:
    mg_per_day: FILL_IN
    last_dose_time: FILL_IN
  alcohol:
    frequency: never          # daily | weekly | monthly | rarely | never
    typical_units_per_occasion: 0
    typical_drinks: []
  cannabis:
    frequency: never
    typical_time: evening
    typical_form: FILL_IN
  nicotine:
    frequency: never
    form: none
  medications: []             # anything relevant to nutrient targets (e.g. stimulants, hormonal therapy)
  supplements: []

# ── Medical / nutritional flags ────────────────────────────────────────────────
medical_flags: []              # ex: ["alergia_x", "deficiencia_vit_d"]
bloodwork_flags: []

# ── Goal ──────────────────────────────────────────────────────────────────────
goals:
  primary: FILL_IN             # ex: recomp, cutting, bulking, maintenance
  performance_focus: []        # ex: [forca, resistencia, mobilidade]
  philosophical: FILL_IN        # a sentence on why this goal matters to you

# ── Preferred meal times ────────────────────────────────────────────────────────
meal_times:
  cafe_da_manha: "08:00"
  lanche_manha: "10:30"
  almoco: "12:30"
  lanche_tarde: "16:00"
  jantar: "20:00"

# ── Nutrition targets (required by the app — fill these in) ───────────────────
nutrition_targets:
  protein_g_per_day: FILL_IN
  hydration_l_per_day: FILL_IN
  total_kcal_target_off_day: FILL_IN
  total_kcal_target_skate_day: FILL_IN  # reused key name for schema compatibility —
                                          # this just means "high-activity day" target;
                                          # set equal to total_kcal_target_off_day if
                                          # you don't have a distinct high-intensity day

# ── Food preferences (required by the app — fill in the specifics) ────────────
food_preferences:
  hard_no: []                  # allergies / absolute blocks, e.g. [tomate, amendoim]
  texture_aversions: []
  soft_dislikes: []
