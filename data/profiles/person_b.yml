# Person B profile — starter template.
# Same schema as person_a.yml — fill in the same fields.
#
# The app (app/src/lib/profile.ts) reads: name, age_years, height_cm, weight_kg,
# body_fat_pct, estimated_bmr_kcal, goals, nutrition_targets, medical_flags,
# food_preferences. Fill those in first — they're what unlocks the meal plan
# and the AI Meal Plan Designer for this profile. Everything else below is
# richer context for future clinical/activity-aware planning, same spirit as
# person_a.yml.

name: FILL_IN
sex: female
age_years: FILL_IN
height_cm: FILL_IN
weight_kg: FILL_IN
body_fat_pct:            # optional; leave blank if unknown
estimated_bmr_kcal: FILL_IN   # from InBody/RelaxFit if available, else Mifflin-St Jeor estimate

# ── Activity ──────────────────────────────────────────────────────────────────
activity:
  - type: musculacao
    days_per_week: FILL_IN
    minutes_per_session: FILL_IN
    typical_time: evening
    intensity: moderate
  # add other activities (yoga, caminhada, pilates, dança, natação) by copying the block above

# ── Sleep ─────────────────────────────────────────────────────────────────────
sleep:
  bedtime: "23:30"
  waketime: "07:30"

# ── Substances ────────────────────────────────────────────────────────────────
substances:
  caffeine:
    mg_per_day: FILL_IN
    last_dose_time: "16:00"
  alcohol:
    frequency: weekly            # daily | weekly | monthly | rarely | never
    typical_units_per_occasion: 0
    typical_drinks: []
  cannabis:
    frequency: never             # daily | weekly | monthly | rarely | never
    typical_time: evening
    typical_form: flor
  nicotine:
    frequency: never
    form: none
  medications: []                # ex: contraceptive ["pílula_combinada"], hormonal therapy, antidepressants — relevant for B6/B12/folato/Mg targets
  supplements: []

# ── Medical / nutritional flags (encoded for nutrition planning calibration) ──
# Especially relevant for women: ferritina, vit D, B12, ciclo menstrual (TPM, fluxo intenso → +ferro)
medical_flags: []                # ex: ["sop", "endometriose", "tireoide", "ferritina_baixa_historico"]
bloodwork_flags: []
menstrual_cycle:                 # optional but helpful for nutrient timing
  tracks: false                  # true if she tracks the cycle and wants the planner to adjust ferro/Mg around it
  typical_length_days: 28
  notes:                         # free text: "TPM forte", "fluxo intenso", "ciclo irregular"

# ── Nutrition targets (required by the app — fill these in) ───────────────────
nutrition_targets:
  protein_g_per_day: FILL_IN
  hydration_l_per_day: FILL_IN
  total_kcal_target_off_day: FILL_IN
  total_kcal_target_skate_day: FILL_IN  # reused key name for schema compatibility with
                                          # person_a.yml — this just means "high-activity
                                          # day" target; set equal to total_kcal_target_off_day
                                          # if she has no distinct high-intensity training day

# ── Goal ──────────────────────────────────────────────────────────────────────
goals:
  primary: FILL_IN                # ex: recomp, cutting, bulking, maintenance
  performance_focus: []          # ex: [forca, mobilidade, resistencia]
  philosophical: FILL_IN

# ── Preferred meal times ──────────────────────────────────────────────────────
meal_times:
  cafe_da_manha: "08:00"
  lanche_manha: "10:30"
  almoco: "12:30"
  lanche_tarde: "16:00"
  jantar: "20:00"

# ── Food preferences (required by the app — fill in the specifics) ────────────
food_preferences:
  hard_no: []                    # allergies / absolute blocks, e.g. [tomate, amendoim]
  texture_aversions: []
  soft_dislikes: []
