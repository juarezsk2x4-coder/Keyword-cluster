# Shared household food preferences.
# Per-person specifics (soft dislikes, loved cuisines, favorites, beverages) now
# live inside each profile file (data/profiles/person_a.yml, person_b.yml) —
# same self-contained shape for both. This file holds only what's genuinely
# shared across the household.

# ── Hard restrictions (NEVER include) ────────────────────────────────────────
# Allergies and absolute blocks. The Meal Plan Designer will reject any recipe
# containing any of these in any form.
hard_no: []
  # ex: tomate (bloqueia molho de tomate, extrato, ketchup, sugo, polpa, tomate
  #     seco, lasanha tradicional, pizza marinara, vinagrete tradicional, etc.)
  # add anything household-wide here (ex: amendoim, frutos_do_mar, lactose_estrita, gluten_estrito)

# ── Eating out ───────────────────────────────────────────────────────────────
# Reserve N meal slots per week so the planner doesn't waste ingredients on
# meals you won't cook.
eating_out:
  meals_per_week: 1
  typical_day: friday   # monday..sunday
  typical_meal: jantar  # cafe_da_manha | almoco | jantar
